version: "3.8"

services:
  # Granite 3.3 8B with 32K context (safe memory usage)
  granite-32k:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: meetingops-granite-32k
    restart: unless-stopped
    
    # AMD 780M iGPU Configuration
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
      - AMD_LOG_LEVEL=1
      - GPU_MAX_HEAP_SIZE=100
      - GPU_MAX_ALLOC_PERCENT=100
      - GPU_SINGLE_ALLOC_PERCENT=100
      - VK_LOADER_DEBUG=none
      - MESA_VK_VERSION_OVERRIDE=1.3
      
    # GPU device access
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/kfd:/dev/kfd"
      
    security_opt:
      - seccomp:unconfined
      
    volumes:
      - "/home/ucadmin/llama.cpp/models:/models"
      - granite_cache:/tmp/vulkan_cache
      
    ports:
      - "11438:8080"
      
    # Server startup with 32K context (not 131K)
    command: >
      --model /models/granite-3.3-8b-instruct-Q4_K_M.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 32768
      --batch-size 2048
      --gpu-layers 99
      --verbose
      --threads 8
      --parallel 1
      --flash-attn
    
    networks:
      - meetingops-network
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  meetingops-network:
    external: true

volumes:
  granite_cache:
    driver: local
version: '3.8'

services:
  ollama:
    image: ollama/ollama:rocm
    container_name: unicorn-ollama-enhanced
    restart: unless-stopped
    ports:
      - "11434:11434"  # Keep same port for compatibility
    environment:
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=5m
      - HSA_OVERRIDE_GFX_VERSION=11.0.3  # For Phoenix APU (gfx1103)
      - ROCR_VISIBLE_DEVICES=0
      - GPU_MAX_HW_QUEUES=8
      - GPU_MEMORY_MAX_ALLOCATION=95  # Use up to 95% of VRAM
      - HSA_ENABLE_SDMA=0  # Sometimes helps with stability
      - OLLAMA_DEBUG=1  # Enable debug logging
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
      - /dev/accel:/dev/accel  # NPU device
    volumes:
      - ollama_data:/root/.ollama
      - /sys/class/drm:/sys/class/drm:ro  # For memory info
    # GPU reservation not needed with explicit device mapping
    group_add:
      - "44"    # video group
      - "992"   # render group
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    command: serve

volumes:
  ollama_data:
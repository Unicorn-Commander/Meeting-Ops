version: "3.8"

services:
  # Qwen3-30B-A3B-Instruct-2507 for high-quality meeting analysis
  qwen30b-gpu:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: meetingops-qwen30b
    restart: unless-stopped
    
    # AMD 780M iGPU Configuration with GTT RAM access
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
      - AMD_LOG_LEVEL=1
      - GPU_MAX_HEAP_SIZE=100
      - GPU_MAX_ALLOC_PERCENT=100
      - GPU_SINGLE_ALLOC_PERCENT=100
      - VK_LOADER_DEBUG=none
      - MESA_VK_VERSION_OVERRIDE=1.3
      - MALLOC_MMAP_THRESHOLD_=131072
      - MALLOC_TRIM_THRESHOLD_=134217728
      
    # GPU device access for AMD iGPU
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/kfd:/dev/kfd"
      
    security_opt:
      - seccomp:unconfined
      
    volumes:
      - "/home/ucadmin/llama.cpp/models:/models"
      - qwen_cache:/tmp/vulkan_cache
      
    ports:
      - "11439:8080"
      
    # Server startup with optimized settings for 30B model
    command: >
      --model /models/Qwen_Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 32768
      --batch-size 2048
      --gpu-layers 50
      --verbose
      --threads 6
      --parallel 1
      --mlock
      --numa isolate
      --flash-attn
    
    networks:
      - meetingops-network
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 180s

networks:
  meetingops-network:
    external: true

volumes:
  qwen_cache:
    driver: local
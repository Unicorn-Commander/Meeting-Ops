# Project-Ops bridge CI — Meeting-Ops PR #35 (task c281b70c) gate.
#
# This is the workflow the parked Meeting-Ops -> Project-Ops action-item
# bridge PR was missing: `amanuensis-contract.yml` only covers the Amanuensis
# image contract and never exercises `backend/services/projectops_writer.py`
# (the code the bridge PR changes), so Astra has no green exact-head to merge.
#
# It runs the repository's existing pytest suite for the bridge surface only:
#   * tests/test_projectops_writer.py    — the writer the PR modifies,
#     including the new PROJECTOPS_WRITE_PATH direct/triage switch.
#   * tests/test_projectops_token.py     — the federation token path the
#     triage delegation depends on (Brigade-exchanged meeting-ops actor).
#   * tests/test_projectops_client_token.py — the legacy client token source.
#
# These are the tests `python3 -m pytest tests/ -v` (Makefile / backend/CLAUDE.md)
# selects for the touched code. The three files are hermetic: they inject a
# fake ProjectOpsClient and use httpx.MockTransport, and conftest.py points
# DATABASE_URL at a throwaway SQLite file — no Postgres, no Redis, no Qdrant,
# no network. The writer test file supplies its own `client`/`_writer_schema`
# fixtures ("use the database seam directly instead of booting optional NPU
# routes") so the heavy NPU/STT import tree (torch, fastembed, librosa) is
# never loaded.
#
# Runner facts this file is designed for (legacy1 docker-in-docker sandbox):
#   * `runs-on: ubuntu-latest` — the only label the uc-forgejo-runner
#     advertises (same label `amanuensis-contract.yml` uses). Do not rename.
#   * Job containers have NO docker socket — this workflow runs plain
#     setup-python + pip, never `docker`.
#   * Never publish host ports (`5432:5432`-style pins are the known
#     never-green failure). No `services:` block is needed at all because the
#     bridge tests are SQLite-hermetic; nothing is reached over a port.
#   * setup-python is required: the runner image's Python is 3.10 and the
#     toolcache has no preinstalled interpreter (same as Email-Ops / UUDA CI).
#
# Dependency set is deliberately minimal + pinned to the versions the repo's
# own requirements.txt pins, so the job stays wheel-only (no apt, no
# source-build packages like pyaudio/netifaces) and fast. A new bridge
# dependency should be added here deliberately, not pulled in transitively.

name: Project-Ops bridge CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-tests:
    name: Project-Ops bridge (pytest · hermetic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            "fastapi==0.115.14" \
            "sqlalchemy==2.0.32" \
            "httpx==0.28.1" \
            "pydantic==2.11.0" \
            "pytest==8.3.4" \
            "pytest-asyncio==0.24.0"

      - name: Unit tests (Project-Ops bridge)
        run: >-
          python3 -m pytest
          tests/test_projectops_writer.py
          tests/test_projectops_token.py
          tests/test_projectops_client_token.py
          -q

  summary-suites:
    name: Summarizer suites (pytest · hermetic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            "fastapi==0.115.14" \
            "sqlalchemy==2.0.32" \
            "alembic==1.13.1" \
            "httpx==0.28.1" \
            "pydantic==2.11.0" \
            "pydantic-settings==2.7.0" \
            "python-multipart==0.0.12" \
            "python-jose[cryptography]==3.3.0" \
            "passlib[bcrypt]==1.7.4" \
            "bcrypt==4.2.1" \
            "pyjwt==2.8.0" \
            "cryptography==42.0.0" \
            "pytest==8.3.4" \
            "pytest-asyncio==0.24.0" \
            "redis==5.0.1" \
            "arq>=0.26" \
            "aiofiles==24.1.0" \
            "websockets==12.0" \
            "numpy==2.1.3" \
            "requests==2.32.3" \
            "openai==1.54.4" \
            "anthropic==0.40.0" \
            "reportlab==4.0.4" \
            "python-docx==1.1.2" \
            "jinja2==3.1.4" \
            "markdown==3.7" \
            "python-dotenv==1.0.1" \
            "psutil==5.9.8" \
            "networkx==3.3" \
            "python-dateutil==2.9.0" \
            "pytz==2024.2" \
            "rapidfuzz==3.9.6" \
            "prometheus-client==0.21.0" \
            "structlog==24.4.0" \
            "email-validator==2.2.0" \
            "boto3==1.35.21" \
            "qdrant-client==1.12.1" \
            "mcp>=1.10,<2"

      - name: Summary-adjacent tests (one file per process)
        run: |
          set -eu
          # The literal scan also finds the conftest/child helper and three
          # non-summarizer tests whose generic `summary` matches cover other
          # contracts. Keep those out of this focused gate.
          # Required files from the brief are included: tests/test_summary_grounding.py,
          # tests/test_mapreduce_coverage.py, tests/test_summarizer_parse.py,
          # tests/test_summarizer_prompt_routing.py, tests/test_finalize_job_flow.py,
          # tests/test_federation_meetings.py, tests/test_mcp_tool_response_contracts.py,
          # tests/test_auto_final_summary_persistence.py, tests/test_one_summary_per_meeting.py,
          # tests/test_action_item_resummary_merge.py, and tests/test_export.py.
          test_files=()
          while IFS= read -r test_file; do
            test_files+=("$test_file")
          done < <(
            grep -l 'summar\|ai_insights\|summary_grounding' tests/*.py \
              | sort \
              | grep -Ev '(^|/)(conftest|_summarization_lease_child|test_related_sessions|test_search_analytics|test_tts|test_ws_auth)\.py$'
          )
          for test_file in "${test_files[@]}"; do
            # pytest exit 5 = nothing collected (a module that skips itself on
            # this runner). That is not a failure of the gate.
            python3 -m pytest -p no:cacheprovider "$test_file" -q || { rc=$?; [ "$rc" -eq 5 ] || exit "$rc"; }
          done

      - name: Action-item order checks
        run: |
          set -eu
          python3 -m pytest -p no:cacheprovider \
            tests/test_summary_grounding.py \
            tests/test_action_item_resummary_merge.py \
            -q
          python3 -m pytest -p no:cacheprovider \
            tests/test_action_item_resummary_merge.py \
            tests/test_summary_grounding.py \
            -q
          printf 'SUMMARY: %s isolated files passed; action-item order checks passed forward and reverse\n' \
            "$(grep -l 'summar\|ai_insights\|summary_grounding' tests/*.py \
              | sort \
              | grep -Ev '(^|/)(conftest|_summarization_lease_child|test_related_sessions|test_search_analytics|test_tts|test_ws_auth)\.py$' \
              | wc -l | tr -d ' ')"

  caller-contracts:
    name: Cutover rollback contracts (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate existing consumer contracts
        run: |
          python3 ci/test_amanuensis_cutover.py
          bash -n ci/test_amanuensis_images.sh deploy/cutover/amanuensis-images.sh
          # /brand/* 403 was mode 600 surviving COPY. The image build fails
          # closed if brand files are not world-readable; this grep fails the
          # PR if that check is removed.
          grep -q 'chmod -R a+rX /usr/share/nginx/html' frontend/Dockerfile
          grep -q '/usr/share/nginx/html/brand' frontend/Dockerfile
          bash -n install-meeting-ops.sh
          git diff --check

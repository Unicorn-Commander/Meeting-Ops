name: Amanuensis consumer contract (no cutover)
on:
  push:
    branches: [main, feat/amanuensis-image-contract]
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: false
      - name: Validate opt-in compose and caller contracts
        run: |
          python3 ci/test_amanuensis_contract.py
          bash -n ci/test_amanuensis_images.sh
          git diff --check
      - name: Pull and test immutable images (CPU synthetic only)
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          if [ -n "$REGISTRY_TOKEN" ]; then
            printf '%s' "$REGISTRY_TOKEN" | docker login git.unicorncommander.ai -u "$REGISTRY_USER" --password-stdin
          fi
          bash ci/test_amanuensis_images.sh

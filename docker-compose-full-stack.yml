version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: meetingops-postgres
    environment:
      - POSTGRES_USER=meetingops
      - POSTGRES_PASSWORD=REMOVED
      - POSTGRES_DB=meeting_sessions
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - meetingops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetingops"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: meetingops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - meetingops-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: meetingops-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - meetingops-network
    restart: unless-stopped
    environment:
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__GRPC_PORT=6334

  # Ollama with ROCm for iGPU (Gemma3n)
  ollama:
    image: ollama/ollama:rocm
    container_name: meetingops-ollama
    environment:
      # Ollama settings - CPU mode for stability
      - OLLAMA_KEEP_ALIVE=10m
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_GPU_LAYERS=0
    volumes:
      - ollama_models:/root/.ollama
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    devices:
      - /dev/dri
      - /dev/kfd
    ports:
      - "11434:11434"
    networks:
      - meetingops-network
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    user: "0:44"  # root:video group
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  meetingops-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  ollama_models:
    driver: local
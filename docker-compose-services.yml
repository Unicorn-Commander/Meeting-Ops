services:
  postgres:
    image: postgres:16-alpine
    container_name: meetingops-postgres
    environment:
      - POSTGRES_USER=meetingops
      - POSTGRES_PASSWORD=REMOVED
      - POSTGRES_DB=meeting_sessions
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - meetingops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetingops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meetingops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - meetingops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: meetingops-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - meetingops-network
    restart: unless-stopped
    environment:
      - QDRANT__LOG_LEVEL=INFO

networks:
  meetingops-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
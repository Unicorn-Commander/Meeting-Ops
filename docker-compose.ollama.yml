version: '3.8'

services:
  ollama:
    image: ollama/ollama:rocm
    container_name: unicorn-ollama-enhanced
    restart: unless-stopped
    ports:
      - "11435:11434"  # Different port to not conflict
    environment:
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=5m
      - HSA_OVERRIDE_GFX_VERSION=11.0.0  # For Phoenix APU
      - ROCR_VISIBLE_DEVICES=0
      - GPU_MAX_HW_QUEUES=8
      - GPU_MEMORY_MAX_ALLOCATION=95  # Use up to 95% of VRAM
      - HSA_ENABLE_SDMA=0  # Sometimes helps with stability
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
      - /dev/accel:/dev/accel  # NPU device
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    group_add:
      - video
      - render
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864

volumes:
  ollama_data:
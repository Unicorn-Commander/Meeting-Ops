version: '3.8'

services:
  postgres:
    image: postgres:13-alpine
    container_name: unicorn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: unicorn_db
      POSTGRES_USER: unicorn_user
      POSTGRES_PASSWORD: unicorn_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - unicorn-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: unicorn-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    networks:
      - unicorn-network

  # Updated backend configuration
  backend:
    build: ./backend
    container_name: unicorn-backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://unicorn_user:REMOVED@postgres/unicorn_db
    networks:
      - unicorn-network
    ports:
      - "9050:9050"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: unicorn-frontend
    depends_on:
      - backend
    ports:
      - "7777:80"
    networks:
      - unicorn-network
    restart: unless-stopped

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: unicorn-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@unicorn.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    networks:
      - unicorn-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    profiles:
      - tools  # Only starts when you use --profile tools

networks:
  unicorn-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  pgadmin_data:
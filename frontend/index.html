<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/pwa-512.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b3a6b" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png?v=3" />
    <!-- Meeting-Ops brand typography: Space Grotesk (display) + Inter (UI).
         Self-hosted (see src/fonts.css) so the app can enforce a strict CSP +
         cross-origin isolation with no fonts.googleapis.com / fonts.gstatic.com
         origins to allow-list. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/Inter-400.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/SpaceGrotesk-600.woff2" />
    <link rel="stylesheet" href="/fonts.css" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meet-Ops" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Meeting-Ops · Intelligence for your conversations (whether or not they are)</title>
    <!-- SEO + social link previews. The on-device / privacy-first moat is the
         share hook. og:image uses the canonical public host so previews
         render the product shot regardless of which host embeds the link. -->
    <meta
      name="description"
      content="An AI meeting recorder that processes on your device. Live transcription and summaries run in your browser — in Privacy Mode your audio never leaves your machine. The optional studio-grade pass runs on hardware we operate by default. Open source and self-hostable."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meeting-Ops" />
    <meta property="og:title" content="Meeting-Ops — the open standard for conversation intelligence" />
    <meta
      property="og:description"
      content="Live transcription and summaries that run on your device. Optional studio-grade server pass on hardware we operate by default. Open source, self-hostable, free to start."
    />
    <meta property="og:url" content="https://meeting-ops.unicorncommander.ai/" />
    <meta property="og:image" content="https://meeting-ops.unicorncommander.ai/screenshots/dashboard.png" />
    <meta property="og:image:width" content="1986" />
    <meta property="og:image:height" content="953" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meeting-Ops — conversation intelligence, on your own terms" />
    <meta
      name="twitter:description"
      content="An AI meeting recorder that runs on your device. In Privacy Mode your audio never leaves your machine; the optional studio pass runs on hardware we operate by default. Open source."
    />
    <meta name="twitter:image" content="https://meeting-ops.unicorncommander.ai/screenshots/dashboard.png" />
    <script>
      // The app is a HashRouter SPA, so it only honors /#/route. Public pages
      // (pricing/signup/login) are meant to be typed and shared as real paths,
      // e.g. meetingops.magicunicorn.dev/pricing. Landing on the real path with
      // no hash would otherwise fall back to "/" -> /dashboard. Rewrite to the
      // hash form before React mounts so those links just work. No loop: after
      // the rewrite the hash is set, so the guard is false.
      (function () {
        var path = window.location.pathname.replace(/\/+$/, '');
        if (!window.location.hash && /^\/(pricing|signup|login|terms|privacy|aup|founding-100|contact|forgot-password|reset-password)$/.test(path)) {
          window.location.replace(
            window.location.origin + '/#' + path + window.location.search
          );
        }
      })();
    </script>
  </head>
  <body class="bg-gray-900">
    <div id="root">
      <!-- Fallback content - if you see this, React failed to mount -->
      <div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #f0f3fa; font-family: 'Space Grotesk', Arial, sans-serif;">
        <img src="/brand/meeting-ops-mark.png?v=3" alt="Meeting-Ops" width="88" height="88" style="display:block; margin:0 auto 16px;" />
        <h1 style="font-size: 22px; margin-bottom: 6px; letter-spacing: 0.3px;">Meeting-Ops</h1>
        <p style="color: #d4af37; font-size: 13px; margin-bottom: 14px;">Intelligence for your conversations<br/><span style="opacity: 0.72;">(whether or not they are)</span></p>
        <p style="color: #8895b3; font-size: 12px;">Loading… if this persists, the app failed to mount.</p>
        <noscript>
          <p style="color: #f87171; margin-top: 20px;">JavaScript is required to run this application.</p>
        </noscript>
      </div>
    </div>
    <script>
      // Keep a quiet global error hook for real failures; the two boot
      // console.logs (script-executing / user-agent) were dev noise, removed.
      window.addEventListener('error', function (e) {
        console.error('Meeting-Ops error:', e.message, e.filename, e.lineno, e.colno);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

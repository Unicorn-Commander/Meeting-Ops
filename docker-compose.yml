version: '3.8'

services:
  backend:
    build: ./backend
    container_name: unicorn-backend
    volumes:
      - ./data:/app/data
      - ./recordings:/app/recordings
      - ./whisper_cache:/app/whisper_onnx_cache
      # Audio device access (Linux)
      - /dev/snd:/dev/snd
    environment:
      - DATABASE_URL=sqlite:////app/data/meeting_sessions.db
      - PYTHONUNBUFFERED=1
      # Add your HuggingFace token if you have one
      # - HUGGINGFACE_TOKEN=your_token_here
    devices:
      # Pass through audio devices
      - /dev/snd:/dev/snd
    privileged: true
    group_add:
      - audio
    networks:
      - unicorn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9050/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: unicorn-frontend
    depends_on:
      - backend
    ports:
      - "7776:7777"
    networks:
      - unicorn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: PostgreSQL for production use
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: unicorn-db
  #   environment:
  #     - POSTGRES_USER=unicorn
  #     - POSTGRES_PASSWORD=unicorn_password
  #     - POSTGRES_DB=unicorn_commander
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - unicorn-network
  #   restart: unless-stopped

networks:
  unicorn-network:
    driver: bridge

volumes:
  # For PostgreSQL if enabled
  postgres_data:
    driver: local
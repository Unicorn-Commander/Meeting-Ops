version: '3.8'

networks:
  meeting-ops:
    driver: bridge
  traefik:
    driver: bridge

volumes:
  meeting_ops_postgres_data:
  meeting_ops_redis_data:
  meeting_ops_qdrant_data:
  meeting_ops_ollama_data:
  authentik_postgres_data:
  authentik_redis_data:
  traefik_data:
  traefik_letsencrypt:

services:
  # ============ TRAEFIK REVERSE PROXY ============
  traefik:
    image: traefik:v3.0
    container_name: meeting-ops-traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.network=traefik
      - --providers.docker.exposedByDefault=false
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@meeting-ops.local}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
      - --metrics.prometheus=true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
      - ./traefik:/dynamic
    environment:
      - TRAEFIK_API_DASHBOARD=true
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      
      # Dashboard
      - traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN:-meeting-ops.local}`)
      - traefik.http.routers.traefik.tls=true
      - traefik.http.routers.traefik.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=authentik@docker
    networks:
      - traefik
      - meeting-ops

  # ============ MEETING-OPS SERVICES ============

  # Main PostgreSQL database for Meeting-Ops
  postgres:
    image: postgres:15-alpine
    container_name: meeting-ops-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - meeting_ops_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:-MeetingOps2025!}
      POSTGRES_USER: ${PG_USER:-meetingops}
      POSTGRES_DB: ${PG_DB:-meeting_sessions}
    networks:
      - meeting-ops

  # Redis for Meeting-Ops real-time features
  redis:
    image: redis:7-alpine
    container_name: meeting-ops-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - meeting_ops_redis_data:/data
    networks:
      - meeting-ops

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: meeting-ops-qdrant
    restart: unless-stopped
    volumes:
      - meeting_ops_qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.qdrant.rule=Host(`qdrant.${DOMAIN:-meeting-ops.local}`)
      - traefik.http.routers.qdrant.tls=true
      - traefik.http.routers.qdrant.tls.certresolver=letsencrypt
      - traefik.http.routers.qdrant.middlewares=authentik@docker
      - traefik.http.services.qdrant.loadbalancer.server.port=6333
    networks:
      - traefik
      - meeting-ops

  # Ollama LLM Service with ROCm support
  ollama:
    image: ollama/ollama:rocm
    container_name: meeting-ops-ollama
    restart: unless-stopped
    volumes:
      - meeting_ops_ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_FLASH_ATTENTION=1
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          devices:
            - driver: amd
              capabilities: [gpu]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.ollama.rule=Host(`ollama.${DOMAIN:-meeting-ops.local}`)
      - traefik.http.routers.ollama.tls=true
      - traefik.http.routers.ollama.tls.certresolver=letsencrypt
      - traefik.http.routers.ollama.middlewares=authentik@docker
      - traefik.http.services.ollama.loadbalancer.server.port=11434
    networks:
      - traefik
      - meeting-ops

  # ============ AUTHENTIK SSO SERVICES ============

  # PostgreSQL for Authentik
  authentik-postgres:
    image: postgres:15-alpine
    container_name: authentik-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - authentik_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS:-AuthentikPass2025!}
      POSTGRES_USER: ${AUTHENTIK_PG_USER:-authentik}
      POSTGRES_DB: ${AUTHENTIK_PG_DB:-authentik}
    networks:
      - meeting-ops

  # Redis for Authentik
  authentik-redis:
    image: redis:7-alpine
    container_name: authentik-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - authentik_redis_data:/data
    networks:
      - meeting-ops

  # Authentik Server
  authentik-server:
    image: ghcr.io/goauthentik/authentik:2024.12.1
    container_name: authentik-server
    restart: unless-stopped
    command: server
    environment:
      # Core Authentik Configuration
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-please-change-this-secret-key}
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_LOG_LEVEL: info
      AUTHENTIK_COOKIE_DOMAIN: ${DOMAIN:-meeting-ops.local}
      
      # Database Configuration
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS:-AuthentikPass2025!}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_PG_DB:-authentik}
      
      # Redis Configuration
      AUTHENTIK_REDIS__HOST: authentik-redis
      
      # Email Configuration (Optional)
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL_HOST:-localhost}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL_PORT:-587}
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL_USER:-}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL_PASS:-}
      AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL_TLS:-false}
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL_FROM:-noreply@meeting-ops.local}
    volumes:
      - ./authentik/media:/media
      - ./authentik/templates:/templates
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      
      # Main Authentik interface
      - traefik.http.routers.authentik.rule=Host(`auth.${DOMAIN:-meeting-ops.local}`)
      - traefik.http.routers.authentik.tls=true
      - traefik.http.routers.authentik.tls.certresolver=letsencrypt
      - traefik.http.services.authentik.loadbalancer.server.port=9000
      
      # Forward auth middleware
      - traefik.http.middlewares.authentik.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
      - traefik.http.middlewares.authentik.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.authentik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid
    depends_on:
      - authentik-postgres
      - authentik-redis
    networks:
      - traefik
      - meeting-ops

  # Authentik Worker
  authentik-worker:
    image: ghcr.io/goauthentik/authentik:2024.12.1
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      # Core Authentik Configuration
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-please-change-this-secret-key}
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_LOG_LEVEL: info
      
      # Database Configuration
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS:-AuthentikPass2025!}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_PG_DB:-authentik}
      
      # Redis Configuration
      AUTHENTIK_REDIS__HOST: authentik-redis
      
      # Email Configuration (Optional)
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL_HOST:-localhost}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL_PORT:-587}
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL_USER:-}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL_PASS:-}
      AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL_TLS:-false}
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL_FROM:-noreply@meeting-ops.local}
    user: root
    volumes:
      - ./authentik/media:/media
      - ./authentik/templates:/templates
      - ./authentik/certs:/certs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - authentik-postgres
      - authentik-redis
    networks:
      - meeting-ops

  # ============ MEETING-OPS BACKEND ============
  
  # Meeting-Ops Backend API
  meeting-ops-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meeting-ops-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${PG_USER:-meetingops}:${PG_PASS:-MeetingOps2025!}@postgres:5432/${PG_DB:-meeting_sessions}
      - REDIS_URL=redis://redis:6379
      - OLLAMA_HOST=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - AUTHENTIK_URL=http://authentik-server:9000
      - AUTHENTIK_TOKEN=${AUTHENTIK_API_TOKEN:-}
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/config:/app/config
      - ./backend/data:/app/data
      - /dev/accel:/dev/accel  # NPU device
    devices:
      - /dev/accel/accel0:/dev/accel/accel0
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.backend.rule=Host(`api.${DOMAIN:-meeting-ops.local}`) || (Host(`${DOMAIN:-meeting-ops.local}`) && PathPrefix(`/api`))
      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      - traefik.http.routers.backend.middlewares=authentik@docker
      - traefik.http.services.backend.loadbalancer.server.port=9050
    depends_on:
      - postgres
      - redis
      - authentik-server
    networks:
      - traefik
      - meeting-ops

  # Meeting-Ops Frontend
  meeting-ops-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meeting-ops-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=https://api.${DOMAIN:-meeting-ops.local}
      - VITE_WS_URL=wss://api.${DOMAIN:-meeting-ops.local}
      - VITE_AUTHENTIK_URL=https://auth.${DOMAIN:-meeting-ops.local}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN:-meeting-ops.local}`)
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.routers.frontend.middlewares=authentik@docker
      - traefik.http.services.frontend.loadbalancer.server.port=80
    depends_on:
      - meeting-ops-backend
      - authentik-server
    networks:
      - traefik
services:
  # Qwen3-0.6B for ultra-fast inference testing
  qwen-0.6b-gpu:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: meetingops-qwen-0.6b
    restart: unless-stopped
    
    # AMD 780M iGPU Configuration
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
      - AMD_LOG_LEVEL=1
      - GPU_MAX_HEAP_SIZE=100
      - GPU_MAX_ALLOC_PERCENT=100
      - GPU_SINGLE_ALLOC_PERCENT=100
      - VK_LOADER_DEBUG=none
      - MESA_VK_VERSION_OVERRIDE=1.3
      
    # GPU device access for AMD iGPU
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/kfd:/dev/kfd"
      
    security_opt:
      - seccomp:unconfined
      
    volumes:
      - "/home/ucadmin/llama.cpp/models:/models"
      - qwen_0_6b_cache:/tmp/vulkan_cache
      
    ports:
      - "11440:8080"
      
    # Server startup with optimized settings for small model
    command: >
      --model /models/Qwen_Qwen3-0.6B-Q4_K_M.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 32768
      --batch-size 4096
      --gpu-layers 99
      --verbose
      --threads 4
      --parallel 2
      --flash-attn
    
    networks:
      - meetingops-network
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  meetingops-network:
    external: true

volumes:
  qwen_0_6b_cache:
    driver: local